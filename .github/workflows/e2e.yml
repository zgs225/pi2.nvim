# Real-process end-to-end gate for background bash tasks.
#
# Each script under scripts/e2e/ drives a REAL `pi --mode rpc` child with the
# bundled `extensions/bg-tasks.ts` against a **scripted fake provider** bound to
# 127.0.0.1 — an OpenAI-compatible server written in the script itself, so no
# account, no quota and no model call — with an isolated agent dir
# (`PI_CODING_AGENT_DIR` + `PI_OFFLINE=1`). The assertions are behavioural, and
# the session transcript JSONL is the ground truth.
#
# That is exactly why these eight suites run here while the provider-backed ones
# do not: `bg_tasks_delivery` (a real model answer has to be long enough for a
# task to exit mid-run) and `bg_tasks_notify` need a configured provider, so they
# stay manual (`make e2e-bg-delivery`). See
# .agents/skills/develop/references/testing.md.
#
# Lives under .github/workflows/ and is executed by GitHub Actions ONLY. The
# canonical Gitea instance (git.yuez.me) is this repo's issue tracker — see
# .agents/skills/develop/references/gitea.md — not a second CI host: Actions are
# disabled for this repo there (`has_actions: false`) and not one workflow run has
# ever happened, so a commit that only reaches Gitea runs nothing at all. Both
# toolchains are installed by direct download, so the job is self-contained and
# needs no Node, no package manager and no third-party action beyond checkout.

name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bg-tasks:
    name: background bash tasks (make e2e-bg-*)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pinned on purpose: the scripts assert RPC behaviour that is
      # version-specific, so an upstream release must not silently change what
      # this gate means. Bump all three together with a run of every target.
      PI_VERSION: "1.5.2"
      NVIM_VERSION: "v0.12.6"
      PLENARY_COMMIT: "74b06c6c75e4eeb3108ec01852001636d85a932b"
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          sudo tar -xzf /tmp/nvim.tar.gz -C /opt
          sudo ln -sf /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
          nvim --version | head -1

      - name: Install plenary.nvim
        run: |
          set -euo pipefail
          mkdir -p ~/.local/share/nvim/lazy
          git clone --quiet https://github.com/nvim-lua/plenary.nvim \
            ~/.local/share/nvim/lazy/plenary.nvim
          git -C ~/.local/share/nvim/lazy/plenary.nvim checkout --quiet "${PLENARY_COMMIT}"
          git -C ~/.local/share/nvim/lazy/plenary.nvim rev-parse HEAD

      - name: Install pi
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/pi.tar.gz \
            "https://github.com/earendil-works/pi/releases/download/v${PI_VERSION}/pi-linux-x64.tar.gz"
          sudo tar -xzf /tmp/pi.tar.gz -C /opt
          sudo ln -sf /opt/pi/pi /usr/local/bin/pi
          pi --version

      # One step per suite, so a red run names the property that broke instead
      # of just "an e2e failed". Each script is hermetic (isolated agent dir,
      # isolated session dir, fake provider) and leaves nothing behind but
      # /tmp files.
      - name: stop_task / list_tasks (group kill, no duplicate wake)
        run: make e2e-bg-stop

      - name: stdin + task_input (background shell keeps its pipe)
        run: make e2e-bg-stdin

      - name: completion report shape (banner + structured block reaches the model)
        run: make e2e-bg-report

      - name: fallback injection (a report survives a FAILED request)
        run: make e2e-bg-fallback

      - name: coalesced idle wake (two same-tick completions, ONE wake)
        run: make e2e-bg-wake

      - name: idle-wake cost gate (a held completion starts no turn, rides the next prompt)
        run: make e2e-bg-wake-gate

      - name: deadline check-in + lifetime note (ONE notify-only message each, no kill)
        run: make e2e-bg-deadline

      - name: transcript fold + adoption (survive a SIGKILL)
        run: make e2e-bg-reconcile

      - name: ownership (fork does not adopt, clean quit records kills)
        run: make e2e-bg-ownership

      # A headless failure is hard to read from the script's own output alone:
      # the scripts check against the transcript, so show what it saw.
      - name: Diagnostics on failure
        if: failure()
        run: |
          set -uo pipefail
          for f in /tmp/pi-bash-*.log; do
            [ -f "$f" ] || continue
            echo "=== $f"
            tail -40 "$f"
          done
          for f in $(find /tmp -maxdepth 6 -name '*.jsonl' 2>/dev/null | head -5); do
            echo "=== $f (tail)"
            tail -20 "$f"
          done
