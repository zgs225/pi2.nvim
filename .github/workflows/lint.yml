# CI gates for pi.nvim.
#
# Lives under .github/workflows/ and is executed by GitHub Actions ONLY. The
# canonical Gitea instance (git.yuez.me) is this repo's issue tracker — see
# .agents/skills/develop/references/gitea.md — not a second CI host: Actions are
# disabled for this repo there (`has_actions: false`) and not one workflow run has
# ever happened, so a commit that only reaches Gitea runs nothing at all. Tools are
# installed from upstream binaries / the distro so the workflow stays
# self-contained (no third-party actions, no Neovim).
#
# Three jobs, all required to merge:
#   style    — `make style`  (stylua --check for Lua, ruff format --check for Python)
#   lint     — `make lint`   (lua-language-server --check for lua/ (strict, .luarc.json)
#                              + tests/ and scripts/e2e/ (.luarc-tests.json, narrower);
#                              ruff check for scripts/)
#   checks   — `make check`  (LuaJIT parse gate, docs sync; scripts/checks/)
#              preceded by `make check-selftest`, which proves every gate in
#              `make check` can still FAIL. A gate nobody has seen fail is not a
#              gate — see gotcha G25. `make docs-links` rides along here.
#
# The stylua / lua-language-server / ruff versions are read out of `.mise.toml`,
# the same file developers get their pinned toolchain from, so a version bump
# happens in exactly one place.
#
# `make test` (the plenary suite) is deliberately not one of the three jobs: it
# needs Neovim plus plenary.nvim, so it lives in its own workflow,
# `.github/workflows/tests.yml`, whose `unit` job gates push to main and dev and
# every PR the same way — judged by exit code only, never by grepping the coloured
# output (G25) — with a pinned Neovim / plenary / render-markdown.nvim toolchain.
# Its `e2e` job gates the hermetic `make e2e` scripts in the same workflow. Both
# runs are required before merge; see .agents/skills/develop/SKILL.md § CI
# verification.

name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  style:
    name: formatters (make style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stylua
        run: |
          set -euo pipefail
          version=$(sed -n 's/^stylua = "\(.*\)"$/\1/p' .mise.toml)
          test -n "$version" || { echo "no stylua pin in .mise.toml"; exit 1; }
          curl -fsSL -o /tmp/stylua.zip \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v${version}/stylua-linux-x86_64.zip"
          unzip -o /tmp/stylua.zip -d /tmp/stylua-bin
          install -m 0755 /tmp/stylua-bin/stylua /usr/local/bin/stylua
          stylua --version
      - name: Install ruff
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ruff = "\(.*\)"$/\1/p' .mise.toml)
          test -n "$version" || { echo "no ruff pin in .mise.toml"; exit 1; }
          curl -fsSL -o /tmp/ruff.tar.gz \
            "https://github.com/astral-sh/ruff/releases/download/${version}/ruff-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/ruff.tar.gz -C /tmp
          install -m 0755 /tmp/ruff-x86_64-unknown-linux-gnu/ruff /usr/local/bin/ruff
          ruff --version
      - name: Check formatting
        run: make style

  lint:
    name: static analysis (make lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ruff
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ruff = "\(.*\)"$/\1/p' .mise.toml)
          test -n "$version" || { echo "no ruff pin in .mise.toml"; exit 1; }
          curl -fsSL -o /tmp/ruff.tar.gz \
            "https://github.com/astral-sh/ruff/releases/download/${version}/ruff-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/ruff.tar.gz -C /tmp
          install -m 0755 /tmp/ruff-x86_64-unknown-linux-gnu/ruff /usr/local/bin/ruff
          ruff --version
      - name: Install lua-language-server
        run: |
          set -euo pipefail
          version=$(sed -n 's/^"aqua:LuaLS\/lua-language-server" = "\(.*\)"$/\1/p' .mise.toml)
          test -n "$version" || { echo "no lua-language-server pin in .mise.toml"; exit 1; }
          curl -fsSL -o /tmp/lls.tar.gz \
            "https://github.com/LuaLS/lua-language-server/releases/download/${version}/lua-language-server-${version}-linux-x64.tar.gz"
          mkdir -p /opt/lls
          tar -xzf /tmp/lls.tar.gz -C /opt/lls
          echo "/opt/lls/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: make lint

  checks:
    name: static gates (make check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luajit
        # A LuaJIT 2.1 build is the authority for "loads on Neovim stable" when
        # it rejects Lua 5.3-only syntax, which is not a property of the version
        # number: `parse-luajit` probes the binary before scanning and fails with
        # exit 2 if it accepts `&`, `|`, `<<`, `>>`, `~` or `//`. The distro
        # build installed here passes that probe (`make check` is green).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends luajit
          luajit -v
      - name: Prove the gates can fail (fixtures)
        run: make check-selftest
      - name: Run the static gates
        run: make check
      - name: Validate doc links and anchors
        run: make docs-links
